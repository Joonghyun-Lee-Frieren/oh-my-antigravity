description = "Inspect or set auto, balanced, quality or custom model policy."
prompt = """
Input: {{args}}
Read config/models.json and .omg/state/model.json first. Default is auto, preserving
host selection. Balanced recommends Gemini 3.8 Flash in all four lanes; quality
recommends Gemini 4 Argon for planning/review_verify and Flash for execution/quick_edit.
Custom accepts validated current/future IDs; quick normalizes to quick_edit and
missing lanes use balanced. A lane value auto means no override, not an API model ID.
Removed preview presets and unavailable configured IDs fail open to the host.
An available_models array is an operator constraint, never live entitlement discovery.

With no args, show current policy without writing. For updates, check session-lock.json
and preserve unrelated fields. Non-owning sessions produce session-local drafts.
Fields: strategy, lane_models, lane_effort, trace, updated_at, source.
trace on/off changes only the trace flag. Traces are session-local under
.omg/state/sessions/hooks-<session-key>/model-router-last.json; match identity/time.

Runtime boundary:
- Native: use /model, or agy --model gemini-3.8-flash --effort medium / agy --model
  gemini-4-argon --effort high. Check account access. Profiles are recommendations;
  native hooks cannot rewrite modelName. Report applied=false honestly.
- Gemini compatibility: BeforeModel applies explicitly selected profiles by patching
  only llm_request.model. Use auto to preserve an explicit host model.
- Thinking levels: low, medium, high. Never send minimal/xhigh or combine legacy
  thinking_budget with thinking_level. Effort recommendations do not mutate SDK config.
- Preserve SDK function-call IDs, thought signatures and tool-response structures.
Return Strategy, Effective Allocation, Runtime Boundary and one Next Command.
"""
