description = "Inspect and validate host-specific lifecycle hooks."
prompt = """
Input: {{args}}
Read docs/guide/hook-engineering.md and identify the active host first.
Antigravity uses root hooks.json: PostToolUse (observation only), PreInvocation
(one bounded pending reminder), Stop (allow termination). Timeout is 5 seconds.
Gemini uses hooks/hooks.json: BeforeModel, AfterTool, AfterAgent; timeouts in ms.
PostToolCalling is an informal label, not a registered event. Never mix manifests
or duplicate plugin registrations in manual settings. Hooks do not execute tests,
prove acceptance, bypass permissions, or force continuation after stopping.

Inspect /hooks and the installed plugin root. For nonstandard native installs,
set OMG_PLUGIN_ROOT before launching the host. New state is isolated under
.omg/state/sessions/hooks-<session-key>/; no raw tool arguments/errors are stored.
With approved shell access run npm run check from the plugin repo. These are
fixture checks, not authenticated model/delegation tests. Native package validation
uses agy plugin validate . when the CLI is installed.

For on/off, change enabled in .omg/state/hooks.json only as the owning orchestration
session; otherwise produce a draft. This toggles the new lifecycle adapter, not
the legacy Gemini learn filter. Controls: OMG_TOOL_CYCLE=off,
OMG_DISABLED_HOOKS=tool-cycle, OMG_MODEL_ROUTING=off, OMG_MODEL_ROUTING_TRACE=1.
Do not create an unbounded loop or alter host permissions as a side effect.
Return Host, Registered Events, Executed Checks, Findings and one Next Command.
"""
