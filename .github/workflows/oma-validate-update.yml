name: Validate Antigravity modernization
on:
  push:
    branches: [maintenance/oma-validated-update]
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fab94854f8a7a1c4d71b2e23127f627353ae869d
          path: repo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply verified changes
        run: python tooling/.github/oma-validation/apply.py repo
      - name: Validate package and hook fixtures
        working-directory: repo
        run: npm run check
      - name: Parse command templates
        working-directory: repo
        run: python -c "import pathlib,tomllib; [tomllib.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('commands/oma').glob('*.toml')]; print('All command templates parsed')"
      - name: Validate the native reference CLI
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agy"
          curl --fail --location --retry 2 'https://github.com/google-antigravity/antigravity-cli/releases/download/1.3.5/agy_cli_linux_x64.tar.gz' -o "$RUNNER_TEMP/agy/release.tar.gz"
          echo '007a5a44dbaf1caea464c3d9848c63b2f69945b01a8bf8852c56c477a64374cf  '"$RUNNER_TEMP/agy/release.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/agy/release.tar.gz" -C "$RUNNER_TEMP/agy"
          AGY="$(find "$RUNNER_TEMP/agy" -type f -name agy -print -quit)"
          test -n "$AGY"
          chmod +x "$AGY"
          "$AGY" --version
          "$AGY" plugin validate "$GITHUB_WORKSPACE/repo"
          mkdir -p "$RUNNER_TEMP/agy-home"
          HOME="$RUNNER_TEMP/agy-home" "$AGY" plugin install "$GITHUB_WORKSPACE/repo"
          HOME="$RUNNER_TEMP/agy-home" "$AGY" plugin list --json
      - name: Save validated source
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        shell: bash
        run: tar --exclude=.git -czf oma-validated-source.tar.gz -C repo .
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        with:
          name: oma-validated-source
          path: oma-validated-source.tar.gz
  stage:
    needs: fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fab94854f8a7a1c4d71b2e23127f627353ae869d
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tooling/.github/oma-validation/apply.py repo
      - name: Stage clean product changes
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          rm -f .github/workflows/compatibility-check.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Modernize Antigravity workflows and Gemini model profiles' -m 'Add native lifecycle hooks, explicit agent tools, and session-isolated diagnostics. Preserve host model selection by default and keep Gemini compatibility separate. Refresh installation guides, translations, the landing page, and regression tests for 0.10.0.'
          git push origin HEAD:refs/heads/fix/antigravity-runtime
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
