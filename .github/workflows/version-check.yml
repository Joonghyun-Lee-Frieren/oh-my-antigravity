name: Plugin Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  check-version:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package identity and version
        run: npm run test:version
      - name: Check skill metadata and references
        run: npm run test:skills
      - name: Check generated native entrypoints
        run: npm run test:generated
      - name: Check native package and agent capabilities
        run: npm run test:package
      - name: Exercise workflow boundaries
        run: npm test
