description = "Register research sources and read every bounded byte window before the documentation handoff."
prompt = """
Read the guard contract and docs/guide/series-runtime.md. Initialize if necessary.
Save .omg/drafts/sources.json with files: exact workspace paths to the required
specifications, SDK companion scripts, and versioned local snapshots of web sources.
Run controller sources with that draft. Do not register runtime state or evidence.
For each file, run controller read with file, offset, and limit (4..8192 bytes).
Follow nextOffset until null; do not skip middle windows or infer coverage from grep.
Send focused source material to read-only oma-doc-reader workers; keep summaries small.
Handoff sources must name every registered file exactly. Coverage and hashes must
still match. Reads prove byte delivery, not understanding or completeness of the
chosen source set. Preserve source URLs/versions in snapshot headers and unknowns.
Use a separate immutable snapshot when the task will edit the original document.
"""
