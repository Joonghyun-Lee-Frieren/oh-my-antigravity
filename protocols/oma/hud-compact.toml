description = "Quick toggle: set OmA HUD visibility profile to compact."
prompt = """
Set OmA HUD visibility profile to `compact`.

Protocol:
1. Apply `visibility = compact`.
2. Read `.omg/state/guard.json` before mutating shared HUD state.
3. If filesystem tools are available:
   - if the current orchestration session owns the lock, write/update `.omg/drafts/hud.json` with source `oma:hud-compact`
   - otherwise write `.omg/drafts/sessions/[session-slug]/hud.json` with source `oma:hud-compact` and report the ownership conflict
4. Provide one-line compact HUD preview and recommended follow-up command.

Output format:
## HUD
- applied: compact
- persisted:

## Preview
```text
[OMA][MODEL gemini-4-argon-high/gemini-3.8-flash-medium/gemini-3.8-flash-low runtime:explicit][STAGE team-exec][TASKS 3/8][NEXT /oma:team-verify]
```

## Next Command
- /oma:status
"""
