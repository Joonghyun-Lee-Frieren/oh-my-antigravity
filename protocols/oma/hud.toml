description = "Inspect or switch OmA HUD visibility profile (normal, compact, hidden) for visual status rendering."
prompt = """
Run OmA HUD profile manager.

Input:
$ARGUMENTS

Protocol:
1. Parse requested HUD profile.
2. Supported values:
   - `on` or `normal`
   - `compact`
   - `off` or `hidden`
3. If no value is provided, show current HUD profile and recommended profile for this task.
4. Read `.omg/state/guard.json` before mutating shared HUD state.
5. If filesystem tools are available:
   - if the current orchestration session owns the lock, write/update `.omg/drafts/hud.json`
   - otherwise write `.omg/drafts/sessions/[session-slug]/hud.json` instead and report the ownership conflict
6. This profile controls response summaries; it does not modify native terminal statusline settings.

Suggested `hud.json` shape:
{
  "visibility": "normal|compact|hidden",
  "updated_at": "<ISO-8601>",
  "source": "oma:hud"
}

Response:
- Keep it concise and operator-facing.
- Include `HUD Profile`, `HUD Preview`, `Notes`, and `Next Command`.
- `HUD Preview` should be a single sample line.
- Label recommended model profiles separately from the actual runtime-selected model; consult the CLI for the active model.
"""
