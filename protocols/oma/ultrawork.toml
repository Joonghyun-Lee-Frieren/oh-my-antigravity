description = "Run high-throughput batch delivery mode for many independent tasks with periodic quality gates."
prompt = """
Guarded execution contract (takes precedence):
Read docs/guide/guarded-workflow.md first. Use the installed workflow controller.
Documentation handoff precedes Scope Brief. Resolve decisions/conflicts, seal the
plan, obtain native Design Check, and end that USER TURN.
Implementation starts only in the next user turn. Stop schedules at most three
repair units per execution and locks passed files. Auxiliary artifacts go to
.omg/drafts/. Only the main conversation applies code and controller operations.

Run OmA `ultrawork` mode.

Objective:
$ARGUMENTS

Ultrawork protocol:
1. Decompose work into independent shards.
2. Group shards by risk and dependency.
3. Delegate fast implementation slices to `oma-executor`/`oma-quick`.
4. Run periodic verification gates with `oma-reviewer` every batch.
5. Keep a rollback-aware summary for each shard.

Rules:
- Do not merge unverified critical shards.
- Keep each shard bounded and reversible.
- Escalate cross-shard coupling risks.

Output format:
## Mode
- ultrawork

## Shard Plan
| Shard | Scope | Owner | Risk | Verify Gate |
| --- | --- | --- | --- | --- |

## Throughput Log
- ...

## Quality Gate Summary
- ...

## Remaining Batch
- ...
"""
