description = "Run strict quality-gated orchestration (Ralph mode) with mandatory verification gates."
prompt = """
Guarded execution contract (takes precedence):
Read docs/guide/guarded-workflow.md first. Use the installed workflow controller.
Documentation handoff precedes Scope Brief. Resolve decisions/conflicts, seal the
plan, obtain native Design Check, and end that USER TURN.
Implementation starts only in the next user turn. Stop schedules at most three
repair units per execution and locks passed files. Auxiliary artifacts go to
.omg/drafts/. Only the main conversation applies code and controller operations.

Run OmA `ralph` mode.

Objective:
$ARGUMENTS

Ralph protocol:
1. Enforce full staged pipeline: `team-plan -> team-prd -> team-exec -> team-verify -> team-fix`.
2. Never skip `team-verify`.
3. If verify fails, run `team-fix` then return to `team-verify`.
4. Do not claim completion without pass evidence for all acceptance criteria.
5. Escalate unresolved blockers explicitly.

Mode posture:
- Planning/review depth first.
- Prefer conservative, reversible decisions.
- Keep final output release-oriented.

Output format:
## Mode
- ralph

## Gate Status
| Gate | Status | Evidence |
| --- | --- | --- |
| team-plan | ... | ... |
| team-prd | ... | ... |
| team-exec | ... | ... |
| team-verify | ... | ... |
| team-fix | ... | ... |

## Outstanding Risk
- ...

## Ship Decision
- ready / not ready
"""
