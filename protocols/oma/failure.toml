description = "Report a typed, evidence-preserving failure instead of fabricating success or editing a dependency."
prompt = """
Inspect the actual blocker and controller status. Save .omg/drafts/failure.json with
code (DEPENDENCY_DEFECT|EXTERNAL_ISSUE|RULE_CONFLICT|MISSING_CAPABILITY), reason,
and checks: IDs of real failed checks when available. DEPENDENCY_DEFECT additionally
requires dependency and at least one failed check. Run controller block with it.
State remains blocked and output failure.status is failed. Evidence, receipts and
passed-file locks remain intact. This is an honest exit, never a passed result.
Do not patch vendor code, monkeypatch SDKs, return dummy data, skip cleanup, weaken
tests, or manufacture receipts to satisfy an impossible success requirement.
Ownership, scope changes and recovery remain explicit operator responsibilities.
"""
